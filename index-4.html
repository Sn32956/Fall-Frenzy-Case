<style>
  :root{--bg:#f6f7fb;--card:#fff;--ink:#1c2333;--mute:#6b7488;--line:#e3e6ef;
        --blue:#1f5fbf;--green:#1a8f4d;--amber:#d98a00;--red:#c62839;--grey:#9aa3b5;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px}
  .wrap{display:grid;grid-template-columns:310px 1fr;gap:12px;padding:10px 14px 14px;min-height:0}
  .panel,.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .panel{padding:16px;align-self:stretch}
  h1{font-size:17px;margin:0 0 2px}
  .hdr{padding:12px 14px 0}
  .hdr h1{font-size:24px;margin:0;letter-spacing:-.3px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:11px 0 5px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13.5px;color:var(--ink);user-select:none}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .chip.peak.on{background:#c62839;border-color:#c62839}.chip.disrupt.on{background:#d98a00;border-color:#d98a00}
  .srow{display:flex;align-items:center;gap:8px}
  .srow input[type=range]{flex:1;min-width:0}
  .num{width:62px;border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:13px;text-align:right;font-weight:600;color:var(--blue)}
  .u{font-size:12px;color:var(--mute);margin-left:-3px}
  select{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:13px;background:#fff}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .three div{font-size:10.5px;color:var(--mute)}
  .three .num{width:100%;margin-top:2px}
  .btn{margin-top:12px;width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:12.5px}
  .main{display:flex;flex-direction:column;gap:12px}
  .daybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px}
  .tag{background:#eef3fc;color:var(--blue);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .kpi{padding:12px 14px}
  .kpi .t{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .kpi .v{font-size:32px;font-weight:700;margin-top:3px}
  .kpi .s{font-size:13px;color:var(--mute);margin-top:2px}
  .good{color:var(--green)}.bad{color:var(--red)}
  .pad{padding:12px 14px}
  table{width:100%;border-collapse:collapse}
  th{font-size:12px;text-transform:uppercase;color:var(--mute);letter-spacing:.04em;text-align:left;padding:4px 8px}
  td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
  td.dept{font-weight:700;width:130px}
  .nums{font-size:21px;font-weight:700}
  .nums .arr{color:var(--grey);font-weight:400;margin:0 3px}
  .delta{font-size:12px;font-weight:700;margin-left:5px}
  .meta{font-size:12.5px;color:var(--mute);margin-top:3px;line-height:1.45}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  table.cmp td,table.cmp th{padding:8px 6px;font-size:14px}
  table.cmp tr.sel td{background:#f1f5fd}
  .bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:6px}
  .bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
  .bar{width:60%;border-radius:4px 4px 0 0;min-height:2px}
  .bcol.sel .bar{outline:2px solid var(--ink)}
  .bl{font-size:12px;line-height:1.25;color:var(--mute);margin-top:4px;text-align:center}
  .bv{font-size:12px;font-weight:700}
  .note{font-size:11px;color:var(--mute)}
  .lbl.q{text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink);margin-bottom:1px}
  .hint{font-size:12.5px;font-weight:700;color:var(--blue);margin-top:4px}
  .outgrid{width:100%;border-collapse:collapse;margin-top:2px}
  .outgrid th{padding:2px 2px;text-align:center;font-size:10.5px}
  .outgrid td{padding:3px 2px;border:0;vertical-align:middle}
  .outgrid td.dn{font-size:12px;font-weight:600;white-space:nowrap;padding-right:4px}
  .outgrid .num{width:100%;text-align:center;padding:5px 2px}
  details.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  details.adv summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--blue);list-style:none;user-select:none}
  details.adv summary::-webkit-details-marker{display:none}
  details.adv summary::before{content:"+ ";font-weight:700}
  details.adv[open] summary::before{content:"\2212 "}
  .daybar .chip{padding:6px 12px}
  @media(min-width:1500px){body{zoom:1.15}}
  @media(min-width:1800px){body{zoom:1.35}}
  @media(min-width:2300px){body{zoom:1.7}}
  @media(max-width:1000px){.wrap{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.row2{grid-template-columns:1fr}}
</style>
</head>

      <div class="chips" id="c_ot"></div>
      <div class="lbl q">Plan for typical call-outs?</div>
      <div class="chips" id="c_co"></div>

    <button class="btn" id="reset">Reset</button>
  </div>

  <div class="main">
    <div class="card daybar" id="daybar"></div>
    <div class="kpis" id="kpis"></div>
    <div class="card pad" id="matrix"></div>
    <div class="row2">
      <div class="card pad" id="cmp"></div>
      <div class="card pad" id="week"></div>
    </div>
  </div>
</div>

const M = P.meta, SV = P.svc;
const ROLE = ["Normal day","Weekend before holiday","Holiday","Day after holiday (rebound)"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dl = i => { const p=M.days[i].d.split("-"); return "("+MON[+p[1]-1]+" "+(+p[2])+")"; };
const ORDER = [0,1,2,3,4,5,6]; // calendar order -> index into M.days
const DEF = {sc:0,day:0,store:-1,role:-1,dem:0,out:Array.from({length:7},()=>[[0,0,0],[0,0,0],[0,0,0]]),conf:80,dd:[0,0,0],ot:1,co:1};
let S = JSON.parse(JSON.stringify(DEF));
const $ = id => document.getElementById(id);
const money = x => (x<0?"-$":"$")+Math.abs(Math.round(x)).toLocaleString();
const sgnK = x => (x>0?"+":x<0?"-":"")+"$"+(Math.abs(x)>=1000?(Math.abs(x)/1000).toFixed(1)+"k":Math.round(Math.abs(x)));
const sgn = x => (x>0?"+":x<0?"-":"")+"$"+Math.abs(Math.round(x)).toLocaleString();
const pct = x => (x==null||isNaN(x))?"-":Math.round(x*100)+"%";
const mean = a => a.length? a.reduce((s,v)=>s+v,0)/a.length : null;
const pc = p => p==null?"var(--grey)":p>=0.8?"var(--green)":p>=0.5?"var(--amber)":"var(--red)";

/* ---------- normal CDF (double precision) ---------- */
function Phi(x){
  const xa=Math.abs(x); let c;
  if(xa>37) c=0; else {
    const e=Math.exp(-xa*xa/2);
    if(xa<7.07106781186547){
      let b=0.0352624965998911*xa+0.700383064443688;
      b=b*xa+6.37396220353165; b=b*xa+33.912866078383; b=b*xa+112.079291497871;
      b=b*xa+221.213596169931; b=b*xa+220.206867912376; c=e*b;
      let d=0.0883883476483184*xa+1.75566716318264;
      d=d*xa+16.064177579207; d=d*xa+86.7807322029461; d=d*xa+296.564248779674;
      d=d*xa+637.333633378831; d=d*xa+793.826512519948; d=d*xa+440.413735824752;
      c=c/d;
    } else {
      let b=xa+0.65; b=xa+4/b; b=xa+3/b; b=xa+2/b; b=xa+1/b; c=e/b/2.506628274631;
    }
  }
  return x>0?1-c:c;
}

/* ---------- the model (port of build_plan) ---------- */
// row: [0 sc,1 store,2 dept,3 day,4 shift,5 open,6 min,7 paid,8 mult,9 draft,10 avail,11 maxOT,12 flex,
//       13 costReg,14 costOT,15 cr,16 shareN,17 shareH,18 fc[4],19 partnerIdx]
const BYSC = [0,1,2].map(s=>P.rows.filter(r=>r[0]===s));
// partner indexes were stored relative to the scenario block, which matches BYSC order

function svc(dp,store,util){
  const m=SV[dp];
  const lp=m.i+m.u*util+m.u2*util*util+(store===2?m.s2:store===4?m.s4:0);
  return Phi((Math.log(m.tgt)-lp)/m.sig);
}
function plan(sc, o){
  const R=BYSC[sc], N=R.length;
  const A=new Array(N), req=new Array(N), cr=new Array(N), cap=new Array(N), otc=new Array(N), n=new Array(N);
  for(let i=0;i<N;i++){
    const r=R[i];
    const role=(r[3]===o.day && o.role>=0)? o.role : M.days[r[3]].r;
    const fc=r[18][role], share=role===2? r[17] : r[16];
    const demand=fc*share*r[8]*(1+o.dem)*(1+o.dd[r[2]]);
    req[i]=demand*SV[r[2]].std;
    A[i]=Math.max(0,r[10]-o.out[r[3]][r[2]][r[4]]);
    otc[i]=o.ot? r[11]:0;
    cr[i]=o.co? r[15]:0;
    cap[i]=A[i]+r[12]+otc[i];
  }
  // smallest headcount reaching confidence
  for(let i=0;i<N;i++){
    const r=R[i];
    if(r[5]===0){n[i]=0;continue;}
    let best=cap[i];
    for(let k=Math.max(1,r[6]);k<=cap[i];k++){
      const u=req[i]/(k*(1-cr[i])*r[7]);
      const p=svc(r[2],r[1],u);
      if(!isNaN(p)&&p>=o.conf){best=k;break;}
    }
    n[i]=Math.max(best,r[6]);
  }
  const flexOf=(i,nn)=>{const j=R[i][19]; if(j<0) return 0; return Math.min(R[i][12],Math.max(0,A[j]-nn[j]));};
  for(let pass=0;pass<2;pass++){
    const nn=n.slice();
    for(let i=0;i<N;i++){
      if(R[i][5]===0){n[i]=0;continue;}
      const tc=A[i]+flexOf(i,nn)+otc[i];
      n[i]=Math.min(nn[i],Math.max(tc,0));
    }
  }
  const evalPlan=(nn)=>R.map((r,i)=>{
    const uf=flexOf(i,nn), reg=Math.min(nn[i],A[i]), rem=nn[i]-reg, fl=Math.min(rem,uf), ot=rem-fl;
    const cost=(reg+fl)*r[7]*r[13]+ot*r[7]*r[14];
    const eff=nn[i]*(1-cr[i])*r[7];
    const util=eff>0? req[i]/eff : null;
    return {cost,util,p:util==null?null:svc(r[2],r[1],util),ot,fl};
  });
  const rec=evalPlan(n), dr=evalPlan(R.map(r=>r[9]));
  // output row layout: [sc,st,dp,dy,sh,open,draftN,recN,costD,costR,pD,pR,uD,uR,units,hrs,ot,flex]
  return R.map((r,i)=>[sc,r[1],r[2],r[3],r[4],r[5],r[9],n[i],dr[i].cost,rec[i].cost,dr[i].p,rec[i].p,dr[i].util,rec[i].util,0,req[i],rec[i].ot,rec[i].fl]);
}

/* ---------- aggregation ---------- */
function cond(){return {day:S.day,role:S.role,dem:S.dem/100,out:S.out,conf:S.conf/100,dd:S.dd.map(v=>v/100),ot:S.ot,co:S.co};}
function filt(rs,o){return rs.filter(r=>(o.day===undefined||r[3]===o.day)&&(S.store<0||r[1]===S.store));}
function summarize(rs){
  const open=rs.filter(r=>r[5]===1);
  return {
    draftN:rs.reduce((s,r)=>s+r[6],0), recN:rs.reduce((s,r)=>s+r[7],0),
    costD:rs.reduce((s,r)=>s+r[8],0), costR:rs.reduce((s,r)=>s+r[9],0),
    pD:mean(open.filter(r=>r[10]!=null).map(r=>r[10])), pR:mean(open.filter(r=>r[11]!=null).map(r=>r[11])),
    riskD:open.filter(r=>r[10]!=null&&r[10]<0.5).length, riskR:open.filter(r=>r[11]!=null&&r[11]<0.5).length,
    ot:rs.reduce((s,r)=>s+r[16],0), flex:rs.reduce((s,r)=>s+r[17],0)
  };
}

/* ---------- rendering ---------- */
function chips(id,items,cur,fn,cls){
  $(id).innerHTML=items.map(([lab,val],i)=>`<span class="chip ${cls?cls[i]:""} ${val===cur?"on":""}" onclick="${fn}(${JSON.stringify(val)})">${lab}</span>`).join("");
}
function drawChips(){
  chips("c_sc",M.sc.map((s,i)=>[s,i]),S.sc,"setSc",M.sc.map(s=>s.toLowerCase()));
  chips("c_st",[["All",-1]].concat(M.st.map(s=>["Warehouse "+s,s])),S.store,"setStore");
  chips("c_ot",[["Yes",1],["No",0]],S.ot,"setOt");
  chips("c_co",[["Yes",1],["No",0]],S.co,"setCo");
}
function hints(){
  const tot=S.out[S.day].reduce((a,r)=>a+r[0]+r[1]+r[2],0);
  $("h_out").textContent = M.days[S.day].n+" "+dl(S.day)+": "+(tot===0?"no one called out":tot+" "+(tot===1?"person":"people")+" out in total");
}
function drawOut(){
  let h=`<tr><th></th>${M.sh.map(x=>`<th>${x}</th>`).join("")}</tr>`;
  const short=["Front End","Merch.","Pharmacy"];
  short.forEach((dn,di)=>{
    h+=`<tr><td class="dn">${dn}</td>${M.sh.map((x,si)=>`<td><input class="num" type="number" min="0" max="99" step="1" value="${S.out[S.day][di][si]}" oninput="setOut(${di},${si},this.value)" onchange="this.value=S.out[S.day][${di}][${si}]"></td>`).join("")}</tr>`;
  });
  $("outgrid").innerHTML=h;
}
function setOut(di,si,v){
  S.out[S.day][di][si]=Math.max(0,Math.min(99,Math.floor(+v)||0));
  render();
}
function render(){
  hints();
  const o=cond();
  const all=[0,1,2].map(s=>plan(s,o));
  const rs=all[S.sc];
  // day bar
  const eff=(S.role>=0)?S.role:M.days[S.day].r;
  $("daybar").innerHTML=`${ORDER.map(i=>`<span class="chip ${i===S.day?"on":""}" onclick="setDay(${i})">${M.days[i].n.slice(0,3)} ${dl(i)}</span>`).join("")}<span class="tag">${ROLE[eff]}${S.role>=0?" (override)":""}</span>`;
  // KPIs
  const t=summarize(filt(rs,{day:S.day}));
  const dayName=M.days[S.day].n+" "+dl(S.day);
  $("kpis").innerHTML=`
   <div class="card kpi"><div class="t">Employees to schedule</div><div class="v">${t.recN}</div><div class="s">${dayName}, all shifts${S.store<0?"":" (Warehouse "+S.store+")"}</div></div>
   <div class="card kpi"><div class="t">Labor cost</div><div class="v">${money(t.costR)}</div><div class="s">${dayName}, all departments</div></div>
   <div class="card kpi"><div class="t">Chance of meeting service target</div><div class="v" style="color:${pc(t.pR)}">${pct(t.pR)}</div><div class="s">${t.riskR?t.riskR+" shift"+(t.riskR>1?"s":"")+" below 50%":"No shifts at risk"}</div></div>`;
  // matrix
  const dr=filt(rs,{day:S.day});
  let h=`<b>Suggested staffing, ${dayName}</b><table><tr><th>Department</th>${M.sh.map(s=>`<th>${s}</th>`).join("")}</tr>`;
  M.dp.forEach((dn,di)=>{
    h+=`<tr><td class="dept">${dn}</td>`;
    M.sh.forEach((sn,si)=>{
      const c=dr.filter(r=>r[2]===di&&r[4]===si);
      if(!c.length||c.every(r=>r[5]===0)){h+=`<td class="meta">Closed</td>`;return;}
      const q=summarize(c);
      h+=`<td><div class="nums">${q.recN}<span class="meta" style="font-weight:400"> employees</span></div>
        <div class="meta"><span class="dot" style="background:${pc(q.pR)}"></span>${pct(q.pR)} chance of meeting target</div></td>`;
    });
    h+=`</tr>`;
  });
  $("matrix").innerHTML=h+`</table>`;
  // scenario comparison (selected day)
  let ch=`<b>All scenarios, ${dayName}</b><table class="cmp"><tr><th>Scenario</th><th>Employees</th><th>Labor cost</th><th>Service chance</th></tr>`;
  M.sc.forEach((sn,i)=>{
    const q=summarize(filt(all[i],{day:S.day}));
    ch+=`<tr class="${i===S.sc?"sel":""}" style="cursor:pointer" onclick="setSc(${i})"><td><b>${sn}</b></td><td>${q.recN}</td>
      <td>${money(q.costR)}</td><td><b style="color:${pc(q.pR)}">${pct(q.pR)}</b></td></tr>`;
  });
  $("cmp").innerHTML=ch+`</table>`;
  // week strip
  const diffs=M.days.map((d,i)=>{const q=summarize(filt(rs,{day:i}));return q.costR-q.costD;});
  const mx=Math.max(1,...diffs.map(Math.abs));
  $("week").innerHTML=`<b>Our Plan vs. Current Plan</b>
   <div class="bars">${ORDER.map(i=>{const v=diffs[i];return `<div class="bcol ${i===S.day?"sel":""}" onclick="setDay(${i})"><div class="bv ${v<=0?"good":"bad"}">${sgnK(v)}</div>
   <div class="bar" style="height:${Math.abs(v)/mx*90}px;background:${v<=0?"var(--green)":"var(--red)"}"></div><div class="bl">${M.days[i].n.slice(0,3)}<br>${dl(i)}</div></div>`}).join("")}</div>
`;
}

/* ---------- controls ---------- */
function setSc(i){S.sc=i;drawChips();render()} function setDay(i){S.day=i;drawOut();render()}
function setStore(i){S.store=i;drawChips();render()} function setOt(i){S.ot=i;drawChips();render()} function setCo(i){S.co=i;drawChips();render()}
[0,1,2].forEach(i=>{ $("d"+i).oninput=()=>{S.dd[i]=Math.max(-100,+$("d"+i).value||0); render();}; });
$("role").onchange=()=>{S.role=+$("role").value; render();};
$("reset").onclick=()=>{
  S=JSON.parse(JSON.stringify(DEF));
  [0,1,2].forEach(i=>$("d"+i).value=0); $("role").value=-1; drawChips(); drawOut(); render();
};
drawChips(); drawOut(); render();
</script>
</body>
</html>
